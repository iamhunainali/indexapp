<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CinePlayer X</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* KEEP YOUR CSS SAME (UNCHANGED) */

/* ADD THIS ONLY */

.subtitle-menu{
  position:absolute;
  bottom:90px;
  right:20px;
  display:none;
  flex-direction:column;
  gap:8px;
  padding:12px;
  border-radius:16px;
  background:rgba(10,15,25,0.96);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  z-index:999;
}

.subtitle-menu.show{
  display:flex;
}

.subtitle-menu button,
.subtitle-menu label{
  background:transparent;
  border:none;
  color:#fff;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
  text-align:left;
}

.subtitle-menu button:hover{
  background:rgba(255,255,255,0.08);
}

video::cue{
  color:white;
  font-size:18px;
  background:rgba(0,0,0,0.7);
}

</style>
</head>

<body>

<div class="player-shell">

  <div class="topbar">
    <div class="logo">Cine<span>Player</span></div>
    <div class="badge">UNIVERSAL VIDEO SUPPORT</div>
  </div>

  <div class="player-wrap" id="playerWrap">

    <div id="videoContainer"></div>

    <div class="overlay show">

      <div class="overlay-top">
        <div class="video-title" id="videoTitle">Loading...</div>
        <div class="live-badge">AUTO DETECT</div>
      </div>

      <div class="controls">
        <div class="controls-row">

          <button class="ctrl" onclick="togglePlay()">▶</button>

          <!-- SUBTITLE BUTTON -->
          <button class="ctrl" onclick="toggleSubtitleMenu()">CC</button>

          <input type="range" min="0" max="100" value="100" oninput="setVolume(this.value)">

        </div>
      </div>

    </div>

    <!-- SUBTITLE MENU -->
    <div class="subtitle-menu" id="subtitleMenu">

      <button onclick="autoSubtitles()">Auto Detect</button>

      <button onclick="disableSubtitles()">Off</button>

      <label>
        Upload Subtitle
        <input type="file" accept=".vtt,.srt" hidden onchange="uploadSubtitle(event)">
      </label>

    </div>

  </div>

</div>

<script>

const VIDEO_URL = "YOUR VIDEO URL HERE";

const container = document.getElementById("videoContainer");

let player = document.createElement("video");
player.controls = true;
player.autoplay = true;

container.appendChild(player);
player.src = VIDEO_URL;

/* PLAY */
function togglePlay(){
  player.paused ? player.play() : player.pause();
}

/* MENU */
function toggleSubtitleMenu(){
  document.getElementById("subtitleMenu").classList.toggle("show");
}

/* =========================
   AUTO SUBTITLE DETECT
========================= */
function autoSubtitles(){

  const tracks = player.textTracks;

  if(!tracks || tracks.length === 0){
    alert("No embedded subtitles found");
    return;
  }

  for(let i=0;i<tracks.length;i++){
    tracks[i].mode = "showing";
  }

  document.getElementById("subtitleMenu").classList.remove("show");
}

/* =========================
   DISABLE SUBTITLES
========================= */
function disableSubtitles(){

  const tracks = player.textTracks;

  for(let i=0;i<tracks.length;i++){
    tracks[i].mode = "disabled";
  }

  document.getElementById("subtitleMenu").classList.remove("show");
}

/* =========================
   MANUAL UPLOAD (.VTT / .SRT)
========================= */
function uploadSubtitle(event){

  const file = event.target.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);

  // remove old subtitles
  const old = player.querySelectorAll("track");
  old.forEach(t => t.remove());

  const track = document.createElement("track");
  track.kind = "subtitles";
  track.label = file.name;
  track.src = url;
  track.default = true;

  player.appendChild(track);

  track.addEventListener("load", () => {
    track.mode = "showing";
  });

  document.getElementById("subtitleMenu").classList.remove("show");
}

/* VOLUME */
function setVolume(v){
  player.volume = v/100;
}

</script>

</body>
</html>
