<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Name is Hunain</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#05070d;
      color:#fff;
    }

    /* HEADER */
    header{
      background:#07111f;
      padding:20px 40px;
      text-align:center;
      border-bottom:2px solid #00e0ff;
    }

    .logo{
      font-size:2.5rem;
      font-weight:bold;
      color:#ff2d75;
    }

    /* HERO SECTION */
    .hero{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:80vh;
      text-align:center;
      background:linear-gradient(to right, #07111f, #0b1220);
    }

    .hero h1{
      font-size:3rem;
      margin-bottom:20px;
      color:#00e0ff;
    }

    .hero p{
      font-size:1.2rem;
      color:#9ca3af;
      max-width:600px;
      margin-bottom:30px;
    }

    .hero a{
      text-decoration:none;
      background:#ff2d75;
      color:white;
      padding:12px 25px;
      border-radius:30px;
      font-weight:bold;
      transition:.3s;
    }

    .hero a:hover{
      background:#00b7ff;
    }

    /* FOOTER */
    footer{
      background:#07111f;
      text-align:center;
      padding:25px;
      color:#9ca3af;
      border-top:1px solid #1f2937;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">My Name is Hunain</div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Welcome to My World</h1>
    <p>
      Hi, I’m Hunain. This is my personal landing page — a place to share my journey, passions, and projects. 
      Explore and connect with me!
    </p>
    <a href="#contact">Get in Touch</a>
  </section>

  <!-- FOOTER -->
  <footer>
    © 2026 Hunain Ali - All Rights Reserved
  </footer>

</body>
</html>
