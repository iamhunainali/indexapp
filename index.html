<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CinePlayer X</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
  --bg:#05070d;
  --surface:#0d1320;
  --surface2:#121b2d;
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --text:#f1f5f9;
  --muted:#64748b;
  --border:rgba(255,255,255,0.08);
  --glow:0 0 25px rgba(0,212,255,0.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;

  background-image:
    radial-gradient(circle at top left, rgba(0,212,255,0.08), transparent 30%),
    radial-gradient(circle at bottom right, rgba(124,58,237,0.08), transparent 30%);
}

.player-shell{
  width:100%;
  max-width:1200px;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.logo{
  font-size:28px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
}

.logo span{
  color:var(--accent);
}

.badge{
  padding:7px 14px;
  border-radius:10px;
  border:1px solid rgba(0,212,255,0.25);
  background:rgba(0,212,255,0.08);
  color:var(--accent);
  font-size:11px;
  letter-spacing:1px;
  font-family:'JetBrains Mono',monospace;
}

/* PLAYER */

.player-wrap{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  background:#000;
  border:1px solid var(--border);

  box-shadow:
    0 30px 80px rgba(0,0,0,0.65),
    0 0 0 1px rgba(255,255,255,0.03);
}

/* VIDEO */

#videoContainer{
  width:100%;
  background:#000;
  aspect-ratio:16/9;
}

video,
iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
  background:#000;
}

/* OVERLAY */

.overlay{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  background:
    linear-gradient(to top,
    rgba(0,0,0,0.85) 0%,
    transparent 40%,
    rgba(0,0,0,0.35) 100%);

  opacity:0;
  transition:0.25s;
}

.player-wrap:hover .overlay,
.overlay.show{
  opacity:1;
}

/* TOP */

.overlay-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px;
}

.video-title{
  font-size:14px;
  font-family:'JetBrains Mono',monospace;
  letter-spacing:1px;
}

.live-badge{
  padding:6px 12px;
  border-radius:8px;
  background:rgba(0,212,255,0.08);
  border:1px solid rgba(0,212,255,0.2);
  color:var(--accent);
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
}

/* CENTER PLAY */

.center-play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  width:90px;
  height:90px;

  border-radius:50%;
  background:rgba(0,0,0,0.55);
  border:2px solid rgba(255,255,255,0.2);

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;

  backdrop-filter:blur(8px);

  transition:0.2s;
}

.center-play:hover{
  border-color:var(--accent);
  box-shadow:var(--glow);
}

.center-play svg{
  width:36px;
  fill:#fff;
  margin-left:4px;
}

/* CONTROLS */

.controls{
  padding:0 18px 18px;
}

.progress{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.12);
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  margin-bottom:16px;
}

.progress-fill{
  width:0%;
  height:100%;
  background:
    linear-gradient(90deg,var(--accent),var(--accent2));
}

.controls-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.ctrl{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:transparent;
  color:#fff;
  cursor:pointer;

  display:flex;
  justify-content:center;
  align-items:center;

  transition:0.18s;
}

.ctrl:hover{
  background:rgba(255,255,255,0.08);
}

.ctrl svg{
  width:20px;
  height:20px;
  fill:currentColor;
}

.spacer{
  flex:1;
}

.time{
  font-size:12px;
  font-family:'JetBrains Mono',monospace;
  color:rgba(255,255,255,0.75);
}

/* VOLUME */

.volume{
  width:90px;
}

/* SUBTITLE CONTROLS */

.subtitle-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.subtitle-file{
  display:none;
}

.subtitle-select{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:8px;
  color:#fff;
  padding:4px 8px;
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
}

.subtitle-select option{
  background:var(--surface2);
  color:#fff;
}

/* INFO */

.info-grid{
  margin-top:18px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.info-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
}

.info-label{
  color:var(--muted);
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  margin-bottom:8px;
}

.info-value{
  font-size:15px;
  font-weight:600;
}

/* NOTIF */

.notif{
  position:fixed;
  bottom:25px;
  right:25px;

  padding:14px 18px;

  border-radius:12px;

  background:var(--surface2);
  border:1px solid rgba(0,212,255,0.25);

  color:var(--accent);

  font-size:13px;
  font-family:'JetBrains Mono',monospace;

  transform:translateY(80px);
  opacity:0;
  transition:0.25s;
}

.notif.show{
  transform:translateY(0);
  opacity:1;
}

@media(max-width:900px){

  .info-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:650px){

  .info-grid{
    grid-template-columns:1fr;
  }

  .volume{
    width:60px;
  }

}

</style>
</head>
<body>

<div class="player-shell">

  <div class="topbar">
    <div class="logo">Cine<span>Player</span></div>
    <div class="badge">UNIVERSAL VIDEO SUPPORT</div>
  </div>

  <div class="player-wrap" id="playerWrap">

    <!-- VIDEO CONTAINER -->
    <div id="videoContainer"></div>

    <!-- OVERLAY -->
    <div class="overlay show" id="overlay">

      <div class="overlay-top">
        <div class="video-title" id="videoTitle">
          Loading Video...
        </div>

        <div class="live-badge" id="videoType">
          AUTO DETECT
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls">

        <div class="progress" id="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="controls-row">

          <!-- PLAY -->
          <button class="ctrl" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <!-- BACK -->
          <button class="ctrl" onclick="skip(-10)">
            <svg viewBox="0 0 24 24">
              <path d="M11 18V6l-8.5 6L11 18zm1-12v12l8.5-6L12 6z"/>
            </svg>
          </button>

          <!-- FORWARD -->
          <button class="ctrl" onclick="skip(10)">
            <svg viewBox="0 0 24 24">
              <path d="M13 18l8.5-6L13 6v12zm-1-12L3.5 12 12 18V6z"/>
            </svg>
          </button>

          <!-- VOLUME -->
          <input
            type="range"
            class="volume"
            min="0"
            max="100"
            value="100"
            oninput="setVolume(this.value)"
          >

          <!-- SUBTITLE CONTROLS -->
          <div class="subtitle-controls">
            <button class="ctrl" onclick="document.getElementById('subtitleFile').click()" title="Add Subtitle">
              <svg viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 12h4v2H4v-2zm10 6H4v-2h10v2zm6 0h-4v-2h4v2zm0-4H10v-2h10v2z"/>
              </svg>
            </button>
            
            <select class="subtitle-select" id="subtitleSelect" onchange="changeSubtitle()">
              <option value="">No Subtitles</option>
            </select>
            
            <input type="file" id="subtitleFile" class="subtitle-file" accept=".srt,.vtt,.ass" onchange="loadSubtitleFile(this)">
          </div>

          <!-- TIME -->
          <div class="time" id="time">
            0:00 / 0:00
          </div>

          <div class="spacer"></div>

          <!-- SPEED -->
          <button class="ctrl" onclick="cycleSpeed()">
            <svg viewBox="0 0 24 24">
              <path d="M13 2L3 14h7v8l10-12h-7z"/>
            </svg>
          </button>

          <!-- FULLSCREEN -->
          <button class="ctrl" onclick="toggleFullscreen()">
            <svg viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm12 5v-5h-2v3h-3v2h5zM7 7h3V5H5v5h2V7zm10 0v3h2V5h-5v2h3z"/>
            </svg>
          </button>

        </div>
      </div>

    </div>

    <!-- CENTER PLAY -->
    <div class="center-play" id="centerPlay" onclick="togglePlay()">

      <svg id="centerIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>

    </div>

  </div>

  <!-- INFO -->
  <div class="info-grid">

    <div class="info-card">
      <div class="info-label">STATUS</div>
      <div class="info-value" id="infoStatus">Loading</div>
    </div>

    <div class="info-card">
      <div class="info-label">FORMAT</div>
      <div class="info-value" id="infoFormat">—</div>
    </div>

    <div class="info-card">
      <div class="info-label">RESOLUTION</div>
      <div class="info-value" id="infoRes">—</div>
    </div>

    <div class="info-card">
      <div class="info-label">DURATION</div>
      <div class="info-value" id="infoDur">—</div>
    </div>

  </div>

</div>

<div class="notif" id="notif"></div>

<script>

/* ==========================================
   DEVELOPER VIDEO LINK
   PASTE ANY VIDEO URL HERE
========================================== */

const VIDEO_URL =
"https://861476166.tapecontent.net/radosgw/OxDO0WowB1u7zb/ZnwCFmaOEkD2tL-II0iajiXI6g8fKkQ0fGulhH4eOvJP9IsNlqU6rCXtsjTgczOfUmPzX6ebo7T8vy06CTZQJQ6hvrdPq3M8fodlKL8jJh_iCJxZiPpysP36XF3Vk3IJ0RVW-PncvvcVD3sXeqPoB38tQGjEfc4Szj7JkG9pzQNMh-2W5KxXWIXK9IVrohIOnfMzsVooHD2TA_gX01V-ffdRZinz0RS99JBn8Dt_DMlbaxPJc6JQt8B8l_yYfeAU_H3ry32dKWwpgLdn4QoBI0VK0cfumv8xTmz0jcBvpu0e3er_P9NgbflXYXr223770bPjtzb943WJOnqQnKTzh7TeZCVEr12xGCiWng/My.Royal.Nemesis.S01E05.720p.NF.WEB-DL.ENG-KOR.x264.ESub-KatDrama.mkv.mp4?dl=1";

/* ========================================== */

const container =
document.getElementById("videoContainer");

let player = null;
let currentSpeed = 1;

function isYouTube(url){

  return url.includes("youtube.com") ||
         url.includes("youtu.be");

}

function isM3U8(url){

  return url.includes(".m3u8");

}

function getType(url){

  if(isYouTube(url)) return "YOUTUBE";
  if(isM3U8(url)) return "HLS STREAM";

  if(url.includes(".mp4")) return "MP4";
  if(url.includes(".webm")) return "WEBM";
  if(url.includes(".ogg")) return "OGG";

  return "VIDEO";
}

document.getElementById("videoType")
.textContent = getType(VIDEO_URL);

document.getElementById("infoFormat")
.textContent = getType(VIDEO_URL);

document.getElementById("videoTitle")
.textContent =
VIDEO_URL.split("/").pop().split("?")[0];

/* SUBTITLE FUNCTIONS */

function autoDetectSubtitles() {
  if (!player) return;
  
  // Auto-detect embedded subtitles
  const tracks = player.textTracks;
  const select = document.getElementById("subtitleSelect");
  
  // Clear existing options except "No Subtitles"
  select.innerHTML = '<option value="">No Subtitles</option>';
  
  for (let i = 0; i < tracks.length; i++) {
    const track = tracks[i];
    if (track.kind === 'subtitles' || track.kind === 'captions') {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = track.label || `Track ${i + 1} (${track.language || 'Unknown'})`;
      select.appendChild(option);
      
      // Auto-enable first subtitle track
      if (i === 0) {
        track.mode = 'showing';
        select.value = i;
        showNotif("Auto-detected subtitles enabled");
      } else {
        track.mode = 'disabled';
      }
    }
  }
}

function loadSubtitleFile(input) {
  const file = input.files[0];
  if (!file || !player) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const content = e.target.result;
    
    // Create blob URL for subtitle file
    const blob = new Blob([content], { type: 'text/vtt' });
    const url = URL.createObjectURL(blob);
    
    // Create track element
    const track = document.createElement('track');
    track.kind = 'subtitles';
    track.src = url;
    track.srclang = 'en';
    track.label = file.name;
    track.default = true;
    
    player.appendChild(track);
    
    // Add to select dropdown
    const select = document.getElementById("subtitleSelect");
    const option = document.createElement('option');
    option.value = player.textTracks.length - 1;
    option.textContent = file.name;
    select.appendChild(option);
    
    // Enable the new subtitle
    track.addEventListener('load', function() {
      track.mode = 'showing';
      select.value = player.textTracks.length - 1;
      showNotif("Subtitle loaded: " + file.name);
    });
  };
  
  reader.readAsText(file);
}

function changeSubtitle() {
  if (!player) return;
  
  const select = document.getElementById("subtitleSelect");
  const selectedIndex = select.value;
  
  // Disable all tracks
  for (let i = 0; i < player.textTracks.length; i++) {
    player.textTracks[i].mode = 'disabled';
  }
  
  // Enable selected track
  if (selectedIndex !== "") {
    player.textTracks[selectedIndex].mode = 'showing';
    showNotif("Subtitle changed");
  } else {
    showNotif("Subtitles disabled");
  }
}

/* YOUTUBE */

if(isYouTube(VIDEO_URL)){

  let id = "";

  if(VIDEO_URL.includes("youtu.be")){

    id =
    VIDEO_URL.split("/").pop().split("?")[0];

  }else{

    id =
    new URL(VIDEO_URL)
    .searchParams.get("v");

  }

  container.innerHTML = `
    <iframe
      src="https://www.youtube.com/embed/${id}?autoplay=1&cc_load_policy=1"
      allowfullscreen>
    </iframe>
  `;

  document.getElementById("infoStatus")
  .textContent = "YouTube Embed";

  document.getElementById("overlay")
  .style.display = "none";

  document.getElementById("centerPlay")
  .style.display = "none";

}

/* NORMAL VIDEO */

else{

  player =
  document.createElement("video");

  player.autoplay = true;
  player.preload = "metadata";
  player.crossOrigin = "anonymous";

  container.appendChild(player);

  /* HLS */

  if(isM3U8(VIDEO_URL)){

    if(Hls.isSupported()){

      const hls = new Hls();

      hls.loadSource(VIDEO_URL);

      hls.attachMedia(player);

    }else{

      player.src = VIDEO_URL;

    }

  }

  else{

    player.src = VIDEO_URL;

  }

  /* READY */

  player.addEventListener("loadedmetadata",()=>{

    document.getElementById("infoStatus")
    .textContent = "Ready";

    document.getElementById("infoRes")
    .textContent =
    player.videoWidth +
    "×" +
    player.videoHeight;

    document.getElementById("infoDur")
    .textContent =
    formatTime(player.duration);

    // Auto-detect subtitles after metadata is loaded
    setTimeout(autoDetectSubtitles, 1000);

  });

  /* TIME */

  player.addEventListener("timeupdate",()=>{

    const pct =
    (player.currentTime /
    player.duration) * 100;

    document.getElementById("progressFill")
    .style.width = pct + "%";

    document.getElementById("time")
    .textContent =
    formatTime(player.currentTime) +
    " / " +
    formatTime(player.duration);

  });

}

/* PLAY */

function togglePlay(){

  if(!player) return;

  if(player.paused){

    player.play();

  }else{

    player.pause();

  }

  updateIcons();

}

/* ICONS */

function updateIcons(){

  if(!player) return;

  const paused = player.paused;

  const path =
  paused
  ? "M8 5v14l11-7z"
  : "M6 19h4V5H6v14zm8-14v14h4V5h-4z";

  document.querySelectorAll("#playIcon path,#centerIcon path")
  .forEach(el=>el.setAttribute("d",path));

}

/* SKIP */

function skip(sec){

  if(!player) return;

  player.currentTime += sec;

  showNotif(
  (sec>0?"⏩ +":"⏪ ") +
  Math.abs(sec) + "s");

}

/* VOLUME */

function setVolume(v){

  if(!player) return;

  player.volume = v/100;

}

/* FULLSCREEN */

function toggleFullscreen(){

  const wrap =
  document.getElementById("playerWrap");

  if(!document.fullscreenElement){

    wrap.requestFullscreen();

  }else{

    document.exitFullscreen();

  }

}

/* SPEED */

function cycleSpeed(){

  if(!player) return;

  if(currentSpeed === 1){

    currentSpeed = 1.5;

  }else if(currentSpeed === 1.5){

    currentSpeed = 2;

  }else{

    currentSpeed = 1;

  }

  player.playbackRate =
  currentSpeed;

  showNotif(
  "Speed " + currentSpeed + "×");

}

/* PROGRESS */

document.getElementById("progress")
.addEventListener("click",e=>{

  if(!player) return;

  const rect =
  e.currentTarget
  .getBoundingClientRect();

  const pct =
  (e.clientX - rect.left)
  / rect.width;

  player.currentTime =
  pct * player.duration;

});

/* FORMAT TIME */

function formatTime(sec){

  if(!sec || isNaN(sec))
  return "0:00";

  const h =
  Math.floor(sec/3600);

  const m =
  Math.floor((sec%3600)/60);

  const s =
  Math.floor(sec%60);

  return h>0
  ? h + ":" +
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")

  : m + ":" +
    String(s).padStart(2,"0");

}

/* NOTIF */

let notifTimer;

function showNotif(msg){

  const el =
  document.getElementById("notif");

  el.textContent = msg;

  el.classList.add("show");

  clearTimeout(notifTimer);

  notifTimer = setTimeout(()=>{

    el.classList.remove("show");

  },2500);

}

/* SHORTCUTS */

document.addEventListener("keydown",e=>{

  if(!player) return;

  if(e.key === " "){

    e.preventDefault();

    togglePlay();

  }

  if(e.key === "ArrowRight")
  skip(10);

  if(e.key === "ArrowLeft")
  skip(-10);

  if(e.key === "f")
  toggleFullscreen();

  if(e.key === "s"){
    document.getElementById('subtitleFile').click();
  }

});

</script>

</body>
</html>
