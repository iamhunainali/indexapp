<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CinePlayer Ultra</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#070b11;
  --surface:#0f1520;
  --surface2:#161d2e;
  --border:rgba(255,255,255,0.08);
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --text:#e2e8f0;
  --muted:#64748b;
  --danger:#ff4d67;
  --glow:0 0 30px rgba(0,212,255,0.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;

  background-image:
  radial-gradient(circle at 20% 10%, rgba(0,212,255,0.04), transparent 30%),
  radial-gradient(circle at 80% 80%, rgba(124,58,237,0.06), transparent 30%);
}

/* PLAYER */

.player-shell{
  width:100%;
  max-width:1100px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.logo{
  font-size:26px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
}

.logo span{
  color:var(--accent);
}

.badge{
  background:rgba(0,212,255,0.1);
  border:1px solid rgba(0,212,255,0.25);
  color:var(--accent);
  padding:6px 12px;
  border-radius:8px;
  font-size:11px;
  letter-spacing:1px;
  font-family:'JetBrains Mono',monospace;
}

.player-wrap{
  position:relative;
  background:#000;
  border-radius:22px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:
  0 0 0 1px rgba(255,255,255,0.02),
  0 30px 80px rgba(0,0,0,0.65);
}

/* VIDEO */

video{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
  object-fit:contain;
}

/* OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;

  background:
  linear-gradient(to top,
  rgba(0,0,0,0.85) 0%,
  transparent 38%,
  rgba(0,0,0,0.35) 100%);

  opacity:0;
  transition:0.25s;
}

.player-wrap:hover .overlay,
.overlay.show{
  opacity:1;
}

/* TOP */

.overlay-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 22px;
}

.video-title{
  font-size:14px;
  letter-spacing:1px;
  font-weight:600;
  font-family:'JetBrains Mono',monospace;
  color:#fff;
}

.lang-badge{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(0,212,255,0.25);
  border-radius:8px;
  padding:5px 12px;
  font-size:11px;
  color:var(--accent);
  font-family:'JetBrains Mono',monospace;
}

/* CENTER PLAY */

.center-play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:84px;
  height:84px;
  border-radius:50%;
  background:rgba(0,0,0,0.55);
  border:2px solid rgba(255,255,255,0.2);

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;
  backdrop-filter:blur(5px);

  transition:0.2s;
}

.center-play:hover{
  border-color:var(--accent);
  box-shadow:var(--glow);
}

.center-play svg{
  width:34px;
  height:34px;
  fill:#fff;
  margin-left:4px;
}

/* CONTROLS */

.controls{
  padding:0 18px 16px;
}

/* PROGRESS */

.progress{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.15);
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  margin-bottom:14px;
}

.progress-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
}

/* ROW */

.controls-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.ctrl{
  width:40px;
  height:40px;
  border:none;
  background:transparent;
  border-radius:10px;
  cursor:pointer;
  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  transition:0.18s;
}

.ctrl:hover{
  background:rgba(255,255,255,0.08);
}

.ctrl svg{
  width:20px;
  height:20px;
  fill:currentColor;
}

.time{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:rgba(255,255,255,0.75);
  white-space:nowrap;
}

.spacer{
  flex:1;
}

/* VOLUME */

.volume-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.volume{
  width:85px;
}

/* AUDIO */

.audio-menu{
  position:absolute;
  right:20px;
  bottom:80px;

  width:220px;

  background:rgba(12,18,30,0.95);
  border:1px solid var(--border);
  border-radius:14px;

  overflow:hidden;
  display:none;

  backdrop-filter:blur(10px);
}

.audio-menu.show{
  display:block;
}

.audio-head{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  font-size:12px;
  color:var(--muted);
  letter-spacing:1px;
  font-family:'JetBrains Mono',monospace;
}

.audio-item{
  padding:12px 14px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:0.18s;
}

.audio-item:hover{
  background:rgba(0,212,255,0.08);
}

.audio-item.active{
  background:rgba(0,212,255,0.1);
  color:var(--accent);
}

/* INFO */

.info-bar{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.info-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}

.info-label{
  font-size:11px;
  color:var(--muted);
  letter-spacing:1px;
  font-family:'JetBrains Mono',monospace;
  margin-bottom:8px;
}

.info-value{
  font-size:15px;
  font-weight:600;
}

/* NOTIFICATION */

.notif{
  position:fixed;
  bottom:26px;
  right:26px;

  background:var(--surface2);
  border:1px solid rgba(0,212,255,0.25);
  color:var(--accent);

  padding:14px 18px;
  border-radius:12px;

  font-size:13px;
  font-family:'JetBrains Mono',monospace;

  opacity:0;
  transform:translateY(80px);
  transition:0.25s;

  z-index:999;
}

.notif.show{
  opacity:1;
  transform:translateY(0);
}

@media(max-width:800px){

  .info-bar{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .info-bar{
    grid-template-columns:1fr;
  }

  .volume{
    width:60px;
  }

}

</style>
</head>
<body>

<div class="player-shell">

  <div class="topbar">
    <div class="logo">Cine<span>Player</span></div>
    <div class="badge">AUTO AUDIO DETECT</div>
  </div>

  <div class="player-wrap" id="playerWrap">

    <!-- DEVELOPER VIDEO LINK -->
    <video id="video" preload="metadata">
      <source src="https://youtu.be/IpDO8iXk-A4?si=tGfzlpuj4XYb25re" type="video/mp4">
    </video>

    <!-- OVERLAY -->
    <div class="overlay show" id="overlay">

      <div class="overlay-top">
        <div class="video-title" id="videoTitle">BigBuckBunny.mp4</div>
        <div class="lang-badge" id="langBadge">🌐 AUTO DETECT</div>
      </div>

      <div class="controls">

        <div class="progress" id="progress">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="controls-row">

          <!-- PLAY -->
          <button class="ctrl" onclick="togglePlay()">
            <svg id="playIcon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <!-- BACK -->
          <button class="ctrl" onclick="skip(-10)">
            <svg viewBox="0 0 24 24">
              <path d="M11 18V6l-8.5 6L11 18zm1-12v12l8.5-6L12 6z"/>
            </svg>
          </button>

          <!-- FORWARD -->
          <button class="ctrl" onclick="skip(10)">
            <svg viewBox="0 0 24 24">
              <path d="M13 18l8.5-6L13 6v12zm-1-12L3.5 12 12 18V6z"/>
            </svg>
          </button>

          <!-- VOLUME -->
          <div class="volume-wrap">
            <button class="ctrl" onclick="toggleMute()">
              <svg id="volIcon" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3z"/>
              </svg>
            </button>

            <input
              type="range"
              class="volume"
              min="0"
              max="100"
              value="100"
              oninput="setVolume(this.value)"
            >
          </div>

          <!-- TIME -->
          <div class="time" id="time">
            0:00 / 0:00
          </div>

          <div class="spacer"></div>

          <!-- AUDIO -->
          <button class="ctrl" onclick="toggleAudioMenu()">
            <svg viewBox="0 0 24 24">
              <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>
            </svg>
          </button>

          <!-- SPEED -->
          <button class="ctrl" onclick="setSpeed(1)">
            <svg viewBox="0 0 24 24">
              <path d="M13 2L3 14h7v8l10-12h-7z"/>
            </svg>
          </button>

          <!-- FULLSCREEN -->
          <button class="ctrl" onclick="toggleFullscreen()">
            <svg viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm12 5v-5h-2v3h-3v2h5zM7 7h3V5H5v5h2V7zm10 0v3h2V5h-5v2h3z"/>
            </svg>
          </button>

        </div>
      </div>
    </div>

    <!-- CENTER PLAY -->
    <div class="center-play" id="centerPlay" onclick="togglePlay()">
      <svg id="centerIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>

    <!-- AUDIO MENU -->
    <div class="audio-menu" id="audioMenu">

      <div class="audio-head">
        AUDIO TRACKS
      </div>

      <div id="audioTracks"></div>

    </div>

  </div>

  <!-- INFO -->
  <div class="info-bar">

    <div class="info-card">
      <div class="info-label">STATUS</div>
      <div class="info-value" id="infoStatus">Loading</div>
    </div>

    <div class="info-card">
      <div class="info-label">RESOLUTION</div>
      <div class="info-value" id="infoRes">—</div>
    </div>

    <div class="info-card">
      <div class="info-label">DURATION</div>
      <div class="info-value" id="infoDur">—</div>
    </div>

    <div class="info-card">
      <div class="info-label">AUDIO</div>
      <div class="info-value" id="infoAudio">Auto Detect</div>
    </div>

  </div>

</div>

<div class="notif" id="notif"></div>

<script>

const video = document.getElementById('video');
const playIcon = document.getElementById('playIcon');
const centerIcon = document.getElementById('centerIcon');
const centerPlay = document.getElementById('centerPlay');
const progressFill = document.getElementById('progressFill');
const time = document.getElementById('time');
const audioMenu = document.getElementById('audioMenu');

let isMuted = false;

/* VIDEO READY */

video.addEventListener('loadedmetadata',()=>{

  document.getElementById('infoStatus').textContent='Ready';

  document.getElementById('infoRes').textContent =
    video.videoWidth + '×' + video.videoHeight;

  document.getElementById('infoDur').textContent =
    formatTime(video.duration);

  detectAudioTracks();

});

/* PLAY AUTO */

video.play().then(()=>{

  updateIcons();

}).catch(()=>{

  showNotif('Click play');

});

/* TIME UPDATE */

video.addEventListener('timeupdate',()=>{

  const pct =
    (video.currentTime / video.duration) * 100;

  progressFill.style.width = pct + '%';

  time.textContent =
    formatTime(video.currentTime) +
    ' / ' +
    formatTime(video.duration);

});

/* PLAY PAUSE */

function togglePlay(){

  if(video.paused){

    video.play();

  }else{

    video.pause();

  }

  updateIcons();

}

/* ICONS */

function updateIcons(){

  const paused = video.paused;

  const path = paused
  ? 'M8 5v14l11-7z'
  : 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

  playIcon.querySelector('path')
  .setAttribute('d',path);

  centerIcon.querySelector('path')
  .setAttribute('d',path);

  centerPlay.style.display =
    paused ? 'flex' : 'none';

}

/* SKIP */

function skip(sec){

  video.currentTime += sec;

  showNotif(
    (sec > 0 ? '⏩ +' : '⏪ ') +
    Math.abs(sec) +
    's'
  );

}

/* PROGRESS CLICK */

document.getElementById('progress')
.addEventListener('click',e=>{

  const rect =
    e.currentTarget.getBoundingClientRect();

  const pct =
    (e.clientX - rect.left) / rect.width;

  video.currentTime =
    pct * video.duration;

});

/* VOLUME */

function setVolume(v){

  video.volume = v / 100;

  isMuted = v == 0;

}

function toggleMute(){

  isMuted = !isMuted;

  video.muted = isMuted;

}

/* FULLSCREEN */

function toggleFullscreen(){

  const wrap =
    document.getElementById('playerWrap');

  if(!document.fullscreenElement){

    wrap.requestFullscreen();

  }else{

    document.exitFullscreen();

  }

}

/* SPEED */

function setSpeed(speed=1){

  if(video.playbackRate === 1){

    video.playbackRate = 1.5;

    showNotif('Speed 1.5×');

  }else if(video.playbackRate === 1.5){

    video.playbackRate = 2;

    showNotif('Speed 2×');

  }else{

    video.playbackRate = 1;

    showNotif('Speed 1×');

  }

}

/* AUDIO DETECT */

function detectAudioTracks(){

  const list =
    document.getElementById('audioTracks');

  let html = '';

  if(video.audioTracks && video.audioTracks.length){

    for(let i=0;i<video.audioTracks.length;i++){

      const t = video.audioTracks[i];

      html += `
      <div
        class="audio-item ${t.enabled ? 'active' : ''}"
        onclick="switchAudio(${i})"
        id="track-${i}"
      >
        <span>
          🌐 ${t.language || 'Track ' + (i+1)}
        </span>

        <span>
          ${t.enabled ? '✓' : ''}
        </span>
      </div>`;

    }

    document.getElementById('infoAudio')
    .textContent =
      video.audioTracks.length + ' Tracks';

  }else{

    html = `
    <div class="audio-item active">
      <span>🌐 Main Audio</span>
      <span>✓</span>
    </div>`;

    document.getElementById('infoAudio')
    .textContent = 'Single Track';

  }

  list.innerHTML = html;

}

/* SWITCH AUDIO */

function switchAudio(index){

  if(!video.audioTracks) return;

  for(let i=0;i<video.audioTracks.length;i++){

    video.audioTracks[i].enabled =
      i === index;

    document
    .getElementById('track-'+i)
    .classList.toggle(
      'active',
      i === index
    );

  }

  showNotif(
    'Audio Track ' + (index+1)
  );

}

/* AUDIO MENU */

function toggleAudioMenu(){

  audioMenu.classList.toggle('show');

}

/* FORMAT */

function formatTime(sec){

  if(!sec || isNaN(sec))
    return '0:00';

  const h =
    Math.floor(sec / 3600);

  const m =
    Math.floor((sec % 3600) / 60);

  const s =
    Math.floor(sec % 60);

  return h > 0
  ? h + ':' +
    String(m).padStart(2,'0') +
    ':' +
    String(s).padStart(2,'0')

  : m + ':' +
    String(s).padStart(2,'0');

}

/* NOTIFICATION */

let notifTimer;

function showNotif(msg){

  const el =
    document.getElementById('notif');

  el.textContent = msg;

  el.classList.add('show');

  clearTimeout(notifTimer);

  notifTimer = setTimeout(()=>{

    el.classList.remove('show');

  },2500);

}

/* SHORTCUTS */

document.addEventListener('keydown',e=>{

  if(e.key === ' '){

    e.preventDefault();

    togglePlay();

  }

  if(e.key === 'ArrowRight')
    skip(10);

  if(e.key === 'ArrowLeft')
    skip(-10);

  if(e.key === 'f')
    toggleFullscreen();

  if(e.key === 'm')
    toggleMute();

});

</script>

</body>
</html>
