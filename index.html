<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePlayer Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080c12;
  --surface:#0f1520;
  --surface2:#161d2e;
  --border:rgba(255,255,255,0.07);
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --text:#e2e8f0;
  --muted:#64748b;
  --glow:0 0 20px rgba(0,212,255,0.3);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 16px 48px;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(0,212,255,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(124,58,237,0.04) 0%, transparent 50%);
}

/* TOPBAR */
.topbar{
  width:100%;
  max-width:960px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:22px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
}

.logo span{
  color:var(--accent);
}

.badge{
  background:rgba(0,212,255,0.1);
  border:1px solid rgba(0,212,255,0.25);
  color:var(--accent);
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  padding:4px 10px;
  border-radius:6px;
}

/* URL BAR */
.urlbar{
  width:100%;
  max-width:960px;
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.urlbar input{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  padding:14px 16px;
  font-size:14px;
  font-family:'JetBrains Mono',monospace;
  outline:none;
}

.urlbar input:focus{
  border-color:rgba(0,212,255,0.5);
  box-shadow:0 0 0 3px rgba(0,212,255,0.08);
}

.urlbar button{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  color:#fff;
  border-radius:12px;
  padding:0 24px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  letter-spacing:1px;
}

/* PLAYER */
.player-wrap{
  width:100%;
  max-width:960px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,212,255,0.05),
             0 40px 80px rgba(0,0,0,0.6);
}

.video-area{
  position:relative;
  background:#000;
  aspect-ratio:16/9;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.85) 0%,
    transparent 40%,
    rgba(0,0,0,0.3) 100%
  );
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  opacity:0;
  transition:0.3s;
}

.video-area:hover .overlay,
.overlay.show{
  opacity:1;
}

/* TOP */
.overlay-top{
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.video-title{
  font-size:14px;
  font-weight:600;
  letter-spacing:1px;
  font-family:'JetBrains Mono',monospace;
}

.lang-badge{
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(0,212,255,0.3);
  border-radius:6px;
  padding:4px 10px;
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  color:var(--accent);
}

/* CENTER PLAY */
.center-play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:72px;
  height:72px;
  border-radius:50%;
  background:rgba(0,0,0,0.6);
  border:2px solid rgba(255,255,255,0.25);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.center-play svg{
  width:28px;
  height:28px;
  fill:#fff;
  margin-left:4px;
}

/* CONTROLS */
.overlay-bottom{
  padding:0 16px 14px;
}

.progress-wrap{
  height:5px;
  background:rgba(255,255,255,0.15);
  border-radius:4px;
  margin-bottom:14px;
  cursor:pointer;
  position:relative;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-radius:4px;
}

.controls-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.ctrl-btn{
  background:none;
  border:none;
  color:#fff;
  cursor:pointer;
  padding:6px;
  border-radius:6px;
}

.ctrl-btn:hover{
  background:rgba(255,255,255,0.1);
}

.ctrl-btn svg{
  width:20px;
  height:20px;
  fill:#fff;
}

.time-display{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:rgba(255,255,255,0.8);
}

.spacer{
  flex:1;
}

.vol-slider{
  width:80px;
}

.speed-btn{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:6px;
  color:#fff;
  padding:6px 10px;
  cursor:pointer;
  font-family:'JetBrains Mono',monospace;
}

/* PANELS */
.panels{
  width:100%;
  max-width:960px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-top:12px;
}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
}

.panel-title{
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
  color:var(--muted);
  letter-spacing:2px;
  margin-bottom:12px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:12px;
}

.info-key{
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}

.info-val{
  font-weight:600;
}

.notif{
  position:fixed;
  bottom:24px;
  right:24px;
  background:var(--surface2);
  border:1px solid rgba(0,212,255,0.3);
  border-radius:10px;
  padding:12px 18px;
  font-size:13px;
  font-family:'JetBrains Mono',monospace;
  color:var(--accent);
  transform:translateY(80px);
  opacity:0;
  transition:0.3s;
}

.notif.show{
  transform:translateY(0);
  opacity:1;
}

@media(max-width:700px){

  .urlbar{
    flex-direction:column;
  }

  .panels{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Cine<span>Player</span></div>
  <div class="badge">PRO PLAYER</div>
</div>

<!-- URL INPUT -->
<div class="urlbar">
  <input
    type="text"
    id="videoUrlInput"
    placeholder="https://youtu.be/Ip2TA2ijDmA?si=el_VmULSaZ5dbYUv"
    value="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
  >

  <button onclick="loadVideo()">LOAD VIDEO</button>
</div>

<!-- PLAYER -->
<div class="player-wrap">

  <div class="video-area" id="videoArea">

    <video id="mainVideo" preload="metadata"></video>

    <div class="center-play" id="centerPlay" onclick="togglePlay()">
      <svg id="centerIcon" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>

    <div class="overlay show" id="overlay">

      <div class="overlay-top">
        <div class="video-title" id="videoTitle">NO VIDEO</div>
        <div class="lang-badge" id="langBadge">🌐 AUTO</div>
      </div>

      <div class="overlay-bottom">

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="controls-row">

          <button class="ctrl-btn" onclick="togglePlay()">
            <svg viewBox="0 0 24 24" id="playIcon">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <button class="ctrl-btn" onclick="skipTime(-10)">
            <svg viewBox="0 0 24 24">
              <path d="M11 18V6l-8.5 6L11 18zm1-12v12l8.5-6L12 6z"/>
            </svg>
          </button>

          <button class="ctrl-btn" onclick="skipTime(10)">
            <svg viewBox="0 0 24 24">
              <path d="M13 18l8.5-6L13 6v12zm-1-12L3.5 12 12 18V6z"/>
            </svg>
          </button>

          <input
            type="range"
            class="vol-slider"
            min="0"
            max="100"
            value="100"
            oninput="setVolume(this.value)"
          >

          <span class="time-display" id="timeDisplay">0:00 / 0:00</span>

          <div class="spacer"></div>

          <button class="speed-btn" onclick="setSpeed(1)">1x</button>
          <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
          <button class="speed-btn" onclick="setSpeed(2)">2x</button>

          <button class="ctrl-btn" onclick="toggleFullscreen()">
            <svg viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm12 5v-5h-2v3h-3v2h5zM7 7h3V5H5v5h2V7zm10 0v3h2V5h-5v2h3z"/>
            </svg>
          </button>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- INFO PANELS -->
<div class="panels">

  <div class="panel">
    <div class="panel-title">AUDIO TRACKS</div>
    <div id="audioTrackList">
      Auto detect
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">SUBTITLES</div>

    <input
      id="vttInput"
      placeholder=".vtt subtitle URL"
      style="
        width:100%;
        background:var(--surface2);
        border:1px solid var(--border);
        color:var(--text);
        padding:10px;
        border-radius:8px;
        margin-bottom:10px;
      "
    >

    <button
      onclick="loadSubtitle()"
      style="
        width:100%;
        background:var(--accent);
        color:#000;
        border:none;
        padding:10px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
      "
    >
      LOAD SUBTITLE
    </button>
  </div>

  <div class="panel">
    <div class="panel-title">VIDEO INFO</div>

    <div class="info-row">
      <span class="info-key">STATUS</span>
      <span class="info-val" id="iStatus">Idle</span>
    </div>

    <div class="info-row">
      <span class="info-key">RESOLUTION</span>
      <span class="info-val" id="iRes">—</span>
    </div>

    <div class="info-row">
      <span class="info-key">DURATION</span>
      <span class="info-val" id="iDur">—</span>
    </div>

    <div class="info-row">
      <span class="info-key">FORMAT</span>
      <span class="info-val" id="iFormat">—</span>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
const video = document.getElementById('mainVideo');
const progressFill = document.getElementById('progressFill');
const timeDisplay = document.getElementById('timeDisplay');
const playIcon = document.getElementById('playIcon');
const centerPlay = document.getElementById('centerPlay');
const centerIcon = document.getElementById('centerIcon');
const overlay = document.getElementById('overlay');

let isPlaying = false;

/* AUTO LOAD */
window.addEventListener('DOMContentLoaded', () => {
  loadVideo();

  document
    .getElementById('videoUrlInput')
    .addEventListener('keydown', e => {
      if(e.key === 'Enter') loadVideo();
    });
});

/* LOAD VIDEO */
function loadVideo(){

  const input = document.getElementById('videoUrlInput');

  const url = input.value.trim();

  if(!url){
    showNotif('Enter video URL');
    return;
  }

  video.pause();

  document.getElementById('videoTitle').textContent = 'LOADING...';
  document.getElementById('iStatus').textContent = 'Loading';

  video.src = url;
  video.load();

  const fname = url.split('/').pop().split('?')[0] || 'Video';

  document.getElementById('videoTitle').textContent = fname;

  const ext = fname.includes('.')
    ? fname.split('.').pop().toUpperCase()
    : 'STREAM';

  document.getElementById('iFormat').textContent = ext;

  video.play().then(() => {

    isPlaying = true;

    updatePlayIcon();

    centerPlay.style.display = 'none';

    showNotif('▶ Playing');

  }).catch(() => {

    isPlaying = false;

    updatePlayIcon();

    centerPlay.style.display = 'flex';

    showNotif('Click play');
  });
}

/* EVENTS */
video.addEventListener('loadedmetadata', () => {

  document.getElementById('iStatus').textContent = 'Ready';

  document.getElementById('iDur').textContent =
    formatTime(video.duration);

  document.getElementById('iRes').textContent =
    video.videoWidth + '×' + video.videoHeight;
});

video.addEventListener('timeupdate', () => {

  const pct =
    (video.currentTime / video.duration) * 100;

  progressFill.style.width = pct + '%';

  timeDisplay.textContent =
    formatTime(video.currentTime) +
    ' / ' +
    formatTime(video.duration);
});

video.addEventListener('ended', () => {

  isPlaying = false;

  updatePlayIcon();

  centerPlay.style.display = 'flex';
});

/* PLAY / PAUSE */
function togglePlay(){

  if(video.paused){

    video.play();

    isPlaying = true;

    centerPlay.style.display = 'none';

  }else{

    video.pause();

    isPlaying = false;

    centerPlay.style.display = 'flex';
  }

  updatePlayIcon();
}

function updatePlayIcon(){

  const path = isPlaying
    ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'
    : 'M8 5v14l11-7z';

  playIcon.querySelector('path')
    .setAttribute('d', path);

  centerIcon.querySelector('path')
    .setAttribute('d', path);
}

/* SEEK */
document
.getElementById('progressWrap')
.addEventListener('click', e => {

  const rect = e.currentTarget.getBoundingClientRect();

  const pct =
    (e.clientX - rect.left) / rect.width;

  video.currentTime = pct * video.duration;
});

/* SKIP */
function skipTime(sec){

  video.currentTime += sec;
}

/* VOLUME */
function setVolume(v){

  video.volume = v / 100;
}

/* SPEED */
function setSpeed(speed){

  video.playbackRate = speed;

  showNotif('Speed ' + speed + 'x');
}

/* FULLSCREEN */
function toggleFullscreen(){

  const el = document.getElementById('videoArea');

  if(!document.fullscreenElement){

    el.requestFullscreen();

  }else{

    document.exitFullscreen();
  }
}

/* SUBTITLE */
function loadSubtitle(){

  const url =
    document.getElementById('vttInput').value.trim();

  if(!url){

    showNotif('Enter subtitle URL');

    return;
  }

  const track = document.createElement('track');

  track.kind = 'subtitles';

  track.label = 'Custom';

  track.srclang = 'en';

  track.src = url;

  track.default = true;

  video.appendChild(track);

  showNotif('Subtitle added');
}

/* NOTIFICATION */
let notifTimer;

function showNotif(msg){

  const el = document.getElementById('notif');

  el.textContent = msg;

  el.classList.add('show');

  clearTimeout(notifTimer);

  notifTimer = setTimeout(() => {

    el.classList.remove('show');

  },2500);
}

/* FORMAT TIME */
function formatTime(sec){

  if(!sec || isNaN(sec)) return '0:00';

  const h = Math.floor(sec / 3600);

  const m = Math.floor((sec % 3600) / 60);

  const s = Math.floor(sec % 60);

  return h > 0
    ? h + ':' +
      String(m).padStart(2,'0') +
      ':' +
      String(s).padStart(2,'0')
    : m + ':' +
      String(s).padStart(2,'0');
}

/* SHORTCUTS */
document.addEventListener('keydown', e => {

  if(e.target.tagName === 'INPUT') return;

  if(e.key === ' '){

    e.preventDefault();

    togglePlay();
  }

  if(e.key === 'ArrowRight') skipTime(10);

  if(e.key === 'ArrowLeft') skipTime(-10);

  if(e.key === 'f') toggleFullscreen();
});
</script>

</body>
</html>
