<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>CinePlayer X</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

:root{
  --bg:#05070d;
  --surface:#0d1320;
  --surface2:#121b2d;
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --text:#f1f5f9;
  --muted:#64748b;
  --border:rgba(255,255,255,0.08);
  --glow:0 0 25px rgba(0,212,255,0.25);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rajdhani',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  background-image:
    radial-gradient(circle at top left, rgba(0,212,255,0.08), transparent 30%),
    radial-gradient(circle at bottom right, rgba(124,58,237,0.08), transparent 30%);
}

.player-shell{
  width:100%;
  max-width:1200px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.logo{
  font-size:28px;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
}

.logo span{ color:var(--accent); }

.badge{
  padding:7px 14px;
  border-radius:10px;
  border:1px solid rgba(0,212,255,0.25);
  background:rgba(0,212,255,0.08);
  color:var(--accent);
  font-size:11px;
  font-family:'JetBrains Mono',monospace;
}

/* PLAYER */
.player-wrap{
  position:relative;
  overflow:hidden;
  border-radius:24px;
  background:#000;
  border:1px solid var(--border);
  box-shadow:0 30px 80px rgba(0,0,0,0.65);
}

/* VIDEO */
#videoContainer{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

video, iframe{
  width:100%;
  height:100%;
  border:none;
  display:block;
}

/* SUBTITLE STYLE */
video::cue{
  color:#fff;
  font-size:18px;
  background:rgba(0,0,0,0.75);
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  opacity:0;
  transition:0.25s;
}

.player-wrap:hover .overlay,
.overlay.show{ opacity:1; }

/* CONTROLS */
.controls{
  padding:0 18px 18px;
}

.controls-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.ctrl{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:transparent;
  color:#fff;
  cursor:pointer;
}

.ctrl:hover{
  background:rgba(255,255,255,0.08);
}

/* SUBTITLE MENU */
.subtitle-menu{
  position:absolute;
  bottom:90px;
  right:20px;
  display:none;
  flex-direction:column;
  gap:8px;
  padding:12px;
  border-radius:16px;
  background:rgba(10,15,25,0.96);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
}

.subtitle-menu.show{
  display:flex;
}

.subtitle-menu button,
.subtitle-menu label{
  background:transparent;
  border:none;
  color:#fff;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
}

.subtitle-menu button:hover{
  background:rgba(255,255,255,0.08);
}

/* NOTIF */
.notif{
  position:fixed;
  bottom:25px;
  right:25px;
  padding:14px 18px;
  border-radius:12px;
  background:var(--surface2);
  border:1px solid rgba(0,212,255,0.25);
  color:var(--accent);
  font-size:13px;
  transform:translateY(80px);
  opacity:0;
  transition:0.25s;
}

.notif.show{
  transform:translateY(0);
  opacity:1;
}

</style>
</head>

<body>

<div class="player-shell">

<div class="topbar">
  <div class="logo">Cine<span>Player</span></div>
  <div class="badge">UNIVERSAL VIDEO SUPPORT</div>
</div>

<div class="player-wrap">

  <div id="videoContainer"></div>

  <!-- CONTROLS -->
  <div class="controls">

    <div class="controls-row">

      <button class="ctrl" onclick="togglePlay()">▶</button>

      <!-- SUBTITLE BUTTON -->
      <button class="ctrl" onclick="toggleSubtitleMenu()">CC</button>

    </div>

  </div>

  <!-- SUBTITLE MENU -->
  <div class="subtitle-menu" id="subtitleMenu">

    <button onclick="autoSubtitles()">Auto Detect</button>

    <button onclick="disableSubtitles()">Off</button>

    <label>
      Upload Subtitle
      <input type="file" accept=".vtt,.srt" hidden onchange="uploadSubtitle(event)">
    </label>

  </div>

</div>

<div class="notif" id="notif"></div>

</div>

<script>

const VIDEO_URL = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

const container = document.getElementById("videoContainer");

let player;

player = document.createElement("video");
player.controls = true;
player.autoplay = true;

container.appendChild(player);

player.src = VIDEO_URL;

/* PLAY */
function togglePlay(){
  if(player.paused) player.play();
  else player.pause();
}

/* MENU */
function toggleSubtitleMenu(){
  document.getElementById("subtitleMenu").classList.toggle("show");
}

/* AUTO DETECT SUBTITLES */
function autoSubtitles(){

  const tracks = player.textTracks;

  if(!tracks || tracks.length === 0){
    showNotif("No embedded subtitles found");
    return;
  }

  for(let i=0;i<tracks.length;i++){
    tracks[i].mode = "showing";
  }

  showNotif("Auto subtitles enabled");
  document.getElementById("subtitleMenu").classList.remove("show");
}

/* UPLOAD SUBTITLE */
function uploadSubtitle(e){

  const file = e.target.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);

  const track = document.createElement("track");
  track.kind = "subtitles";
  track.label = file.name;
  track.src = url;
  track.default = true;

  player.appendChild(track);

  track.addEventListener("load",()=>{
    track.mode = "showing";
  });

  showNotif("Subtitle loaded");
  document.getElementById("subtitleMenu").classList.remove("show");
}

/* DISABLE */
function disableSubtitles(){

  const tracks = player.textTracks;

  for(let i=0;i<tracks.length;i++){
    tracks[i].mode = "disabled";
  }

  showNotif("Subtitles Off");
  document.getElementById("subtitleMenu").classList.remove("show");
}

/* NOTIFICATION */
function showNotif(msg){

  const el = document.getElementById("notif");
  el.textContent = msg;
  el.classList.add("show");

  setTimeout(()=>el.classList.remove("show"),2000);
}

</script>

</body>
</html>
